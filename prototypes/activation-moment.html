<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyAITwin · Activation Moment</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Space+Grotesk:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:    #060608;
    --ink:   #ECECF0;
    --dim:   #7a7a86;
    --dim-2: #565663;
    --gold:  #ffe34a;
    --line:  rgba(150,150,170,0.12);
  }
  html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: 'Space Grotesk', system-ui, sans-serif; overflow: hidden; }
  #graph { position: fixed; inset: 0; z-index: 0; }

  /* ── Top nav ─────────────────────────────────────────────── */
  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 20;
        display: flex; align-items: center; gap: 16px; padding: 16px 28px; }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo .sq { width: 20px; height: 20px; border-radius: 4px; background: var(--gold);
              box-shadow: 0 0 0 1px rgba(0,0,0,0.5) inset, 0 2px 14px rgba(255,227,74,0.30); }
  .logo .wm { display: flex; flex-direction: column; line-height: 1; }
  .logo .name { font-family: 'Fraunces', serif; font-weight: 400; font-size: 16px; letter-spacing: -0.01em; }
  .logo .by   { font-family: 'IBM Plex Mono', monospace; font-size: 8px; letter-spacing: 0.22em; color: var(--dim); margin-top: 3px; }
  .nav-spacer { flex: 1; }
  .counter { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: var(--dim); }
  .counter b { color: var(--ink); font-weight: 500; }
  .tabs { display: flex; gap: 18px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.16em; }
  .tabs a { color: var(--dim); text-decoration: none; }
  .tabs a.active { color: var(--gold); }
  .reset { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: var(--dim-2);
           background: none; border: none; cursor: pointer; padding: 4px 6px; }
  .reset:hover { color: var(--dim); }

  /* ── Hover card (the product's contextual card, on demand) ─ */
  #card { position: fixed; z-index: 15; min-width: 168px; max-width: 248px; padding: 13px 15px;
          border-radius: 12px; border: 1px solid var(--line);
          background: rgba(14,14,18,0.72); backdrop-filter: blur(14px) saturate(1.1);
          -webkit-backdrop-filter: blur(14px) saturate(1.1);
          box-shadow: 0 18px 50px rgba(0,0,0,0.5); pointer-events: none;
          opacity: 0; transform: translateY(4px); transition: opacity 180ms ease, transform 180ms ease; }
  #card.show { opacity: 1; transform: translateY(0); }
  #card .kicker { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.18em;
                  text-transform: uppercase; display: flex; align-items: center; gap: 7px; }
  #card .kicker .swatch { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  #card .body { font-family: 'Fraunces', serif; font-size: 15px; font-weight: 400; line-height: 1.32; margin: 9px 0 8px; color: var(--ink); }
  #card .foot { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.06em; color: var(--dim); }

  /* ── Bottom composer + hint + chips ──────────────────────── */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
          display: flex; flex-direction: column; align-items: center; gap: 12px;
          padding: 0 24px 30px; background: linear-gradient(to top, rgba(6,6,8,0.92) 30%, transparent); }
  .hint { font-family: 'Fraunces', serif; font-style: italic; font-size: 14.5px; color: var(--dim);
          text-align: center; transition: opacity 400ms ease; max-width: 560px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 680px; }
  .chip { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.04em; color: var(--dim);
          border: 1px solid var(--line); border-radius: 999px; padding: 7px 13px; cursor: pointer;
          background: rgba(255,255,255,0.02); transition: color 150ms, border-color 150ms, background 150ms; white-space: nowrap; }
  .chip:hover { color: var(--ink); border-color: rgba(150,150,170,0.28); background: rgba(255,255,255,0.05); }
  .composer { display: flex; align-items: center; gap: 10px; width: min(640px, 92vw);
              border: 1px solid var(--line); border-radius: 14px; padding: 8px 8px 8px 18px;
              background: rgba(16,16,20,0.7); backdrop-filter: blur(12px); }
  .composer input { flex: 1; background: none; border: none; outline: none; color: var(--ink);
                    font-family: 'Space Grotesk', sans-serif; font-size: 14.5px; }
  .composer input::placeholder { color: var(--dim-2); }
  .composer button { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
                     color: #1a1709; background: var(--gold); border: none; border-radius: 9px; padding: 10px 18px; cursor: pointer;
                     transition: transform 120ms ease, box-shadow 150ms ease; }
  .composer button:hover { box-shadow: 0 4px 18px rgba(255,227,74,0.28); }
  .composer button:active { transform: translateY(1px); }

  /* ── Toast (understated) ─────────────────────────────────── */
  #toast { position: fixed; left: 50%; bottom: 168px; transform: translate(-50%, 8px); z-index: 25;
           font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.04em; color: var(--ink);
           border: 1px solid var(--line); border-radius: 10px; padding: 11px 16px;
           background: rgba(16,16,20,0.82); backdrop-filter: blur(12px);
           box-shadow: 0 14px 40px rgba(0,0,0,0.45); opacity: 0; pointer-events: none;
           transition: opacity 420ms ease, transform 420ms ease; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast .lnk { color: var(--gold); margin-left: 6px; }

  /* ── Loading veil ────────────────────────────────────────── */
  #veil { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center;
          background: var(--bg); color: var(--dim); font-family: 'IBM Plex Mono', monospace; font-size: 11px;
          letter-spacing: 0.18em; transition: opacity 600ms ease; }
  #veil.gone { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
  <div id="graph"></div>

  <nav>
    <div class="logo">
      <div class="sq"></div>
      <div class="wm"><span class="name">MyAITwin</span><span class="by">BY LUTO</span></div>
    </div>
    <div class="nav-spacer"></div>
    <div class="counter">your brain · <b id="count">0</b> items</div>
    <div class="nav-spacer"></div>
    <div class="tabs"><a class="active">TWIN</a><a>LIBRARY</a></div>
    <button class="reset" onclick="location.reload()">RESET</button>
  </nav>

  <div id="card">
    <div class="kicker"><span class="swatch"></span><span class="kt"></span></div>
    <div class="body"></div>
    <div class="foot"></div>
  </div>

  <div class="dock">
    <div class="hint" id="hint">Store a thought, and watch it take its place in your brain.</div>
    <div class="chips" id="chips"></div>
    <div class="composer">
      <input id="input" placeholder="What's on your mind?" autocomplete="off" />
      <button id="store">Store</button>
    </div>
  </div>

  <div id="toast"><span class="tt"></span><a class="lnk" href="#" onclick="return false">Explore in library →</a></div>

  <div id="veil">forming your brain…</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <script src="https://unpkg.com/3d-force-graph@1.73.4/dist/3d-force-graph.min.js"></script>
  <script>
  /* ════════════════════════════════════════════════════════════════════════
     TUNING KNOBS — the calm lives here. Dial these to taste.
     ════════════════════════════════════════════════════════════════════════ */
  const T = {
    // motion / settle
    DRIFT_SPEED:     0.28,   // camera auto-orbit speed (OrbitControls). Tiny = barely moving.
    VELOCITY_DECAY:  0.62,   // higher = simulation settles faster / calmer (less jitter)
    ALPHA_DECAY:     0.055,  // higher = cools down sooner
    COOLDOWN_TIME:   5200,   // ms the sim runs before freezing (then dead-still)
    REHEAT_ALPHA:    0.22,   // gentle nudge so the cluster accommodates a new node

    // layout
    REGION_RING_RADIUS: 100, // how far the six clusters sit from centre
    REGION_Y_SPREAD:    24,  // vertical stagger so it reads as a constellation, not a wheel
    CLUSTER_STRENGTH:   0.085,// pull of each node toward its region centre (cluster tightness)
    CHARGE_STRENGTH:   -78,   // intra-cluster repulsion → well-spaced spheres, no speckle
    LINK_DISTANCE:      26,

    // depth / atmosphere
    FOG_DENSITY:        0.0019, // FogExp2 — haze on distant nodes (depth-of-field feel)
    BG:                 0x060608,

    // materials
    NODE_RADIUS:        5.0,
    ACTIVE_SCALE:       1.14,  // a stored node sits slightly fuller than a placeholder
    PH_EMISSIVE:        0.22,  // placeholder: lower glow (soft, unfilled — not a dim ghost)
    ACTIVE_EMISSIVE:    0.62,  // stored: fuller, glossier glow
    PH_OPACITY:         0.66,
    ACTIVE_OPACITY:     0.99,
    PH_ROUGH:           0.46,
    ACTIVE_ROUGH:       0.30,
    METALNESS:          0.10,
    LINK_OPACITY_PH:     0.085,
    LINK_OPACITY_ACTIVE: 0.34,

    // ── THE ACTIVATION (big + dynamic, but premium — cinematic, not cheap) ──
    FORMATION_MS:       780,   // node bloom (ease-out, near-zero → full; no bounce)
    BLOOM_FLARE:        1.7,   // brief extra emissive as it completes, eases back (a confident "ignite")
    GLOW_SCALE:         6.0,   // soft additive halo size (× radius) on stored nodes — the brain's light
    GLOW_OPACITY:       0.5,   // resting halo strength of a stored node
    PULSE_MS:           640,   // light-pulse travel time along each new link (knowledge wiring in)
    PULSE_STAGGER:      95,    // ms between successive link pulses
    SWELL_MS:           1150,  // the whole brain's luminous swell (rise + settle)
    SWELL_AMOUNT:       0.42,  // how much every node brightens at the peak of the swell
    SWELL_AMOUNT_FIRST: 0.85,  // the FIRST store is grander — the brain coming alive
    FOCUS_MS:           880,   // camera push-in toward the new node's region
    FOCUS_HOLD_MS:      540,   // dwell at the formation
    RETURN_MS:          1000,  // ease back out to the calm overview
    FOCUS_DISTANCE:     120,   // how close the push-in frames the region
  };

  const REGIONS = [
    { name: 'Knowledge',     color: 0x7db0ff, sub: 'a piece of what you know',          ph: 'waiting to be filled' },
    { name: 'Skills',        color: 0x5ad6a0, sub: 'a way you turn thinking into output', ph: 'waiting to be filled' },
    { name: 'Meeting notes', color: 0xffce5a, sub: 'a moment worth remembering',         ph: 'waiting to be filled' },
    { name: 'Principles',    color: 0xc98bff, sub: 'a rule you think by',                ph: 'waiting to be filled' },
    { name: 'Brand spec',    color: 0xff8fa3, sub: 'how it should look and feel',        ph: 'waiting to be filled' },
    { name: 'Next steps',    color: 0xff9a52, sub: 'something worth acting on',          ph: 'waiting to be filled' },
  ];
  const NODES_PER_REGION = 5;

  // keyword → region index. Simple heuristic; default Knowledge.
  function pickRegion(text) {
    const s = ' ' + text.toLowerCase() + ' ';
    const has = (...ws) => ws.some(w => s.includes(w));
    if (has('principle', 'rule', 'believe', 'value', 'never ', 'always ', 'worse than')) return 3;
    if (has('skill', 'i can ', 'how to', 'able to', 'learn to', 'craft')) return 1;
    if (has('meeting', 'call ', 'notes', 'discussed', 'sync', 'agenda', 'standup')) return 2;
    if (has('brand', 'colour', 'color', 'font', 'logo', 'design', 'look ', 'feel ', 'aesthetic')) return 4;
    if (has('next', 'todo', 'to-do', 'action', 'ship ', 'task', 'follow up', 'do ')) return 5;
    return 0; // Knowledge
  }

  const CHIPS = [
    'Principle: a false merge is worse than a false duplicate.',
    'Next: ship the activation moment before anything else.',
    'Skill: I can prototype calm 3D interfaces.',
  ];

  /* ── helpers ─────────────────────────────────────────────── */
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOut = t => 1 - Math.pow(1 - t, 3);            // smooth deceleration, NO overshoot
  const hexCss = c => '#' + c.toString(16).padStart(6, '0');

  const regionCenters = REGIONS.map((r, i) => {
    const a = (i / REGIONS.length) * Math.PI * 2;
    return { x: Math.cos(a) * T.REGION_RING_RADIUS, y: (i % 2 ? 1 : -1) * T.REGION_Y_SPREAD, z: Math.sin(a) * T.REGION_RING_RADIUS };
  });

  /* ── build the placeholder graph ─────────────────────────── */
  const nodes = [], links = [];
  let nid = 0;
  REGIONS.forEach((reg, ri) => {
    const ids = [];
    for (let k = 0; k < NODES_PER_REGION; k++) {
      const c = regionCenters[ri];
      const n = {
        id: 'n' + (nid++), region: ri, color: reg.color, state: 'placeholder', text: null,
        x: c.x + (Math.random() - 0.5) * 26, y: c.y + (Math.random() - 0.5) * 26, z: c.z + (Math.random() - 0.5) * 26,
      };
      nodes.push(n); ids.push(n.id);
    }
    // a single soft ring within the cluster
    for (let k = 0; k < ids.length; k++) links.push({ source: ids[k], target: ids[(k + 1) % ids.length] });
    reg._ids = ids;
  });
  // ~5 sparse cross-cluster links between neighbouring regions
  for (let i = 0; i < 5; i++) {
    const a = REGIONS[i]._ids[2], b = REGIONS[(i + 1) % REGIONS.length]._ids[0];
    links.push({ source: a, target: b, cross: true });
  }

  /* ── soft radial glow texture (additive halo behind stored nodes) ───────── */
  const GLOW_TEX = (function () {
    const cv = document.createElement('canvas'); cv.width = cv.height = 128;
    const g = cv.getContext('2d');
    const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    grd.addColorStop(0.0, 'rgba(255,255,255,1)');
    grd.addColorStop(0.22, 'rgba(255,255,255,0.5)');
    grd.addColorStop(1.0, 'rgba(255,255,255,0)');
    g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(cv);
  })();

  /* ── three.js node object: a glossy sphere + a soft glow halo ───────────── */
  function makeNodeObject(node) {
    const group = new THREE.Group();
    const geom = new THREE.SphereGeometry(T.NODE_RADIUS, 40, 40);   // high-poly = no faceting speckle
    const mat = new THREE.MeshStandardMaterial({
      color: node.color, emissive: node.color, emissiveIntensity: T.PH_EMISSIVE,
      roughness: T.PH_ROUGH, metalness: T.METALNESS, transparent: true, opacity: T.PH_OPACITY,
    });
    const sphere = new THREE.Mesh(geom, mat);
    const glowMat = new THREE.SpriteMaterial({ map: GLOW_TEX, color: node.color, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
    const glow = new THREE.Sprite(glowMat); glow.scale.setScalar(T.NODE_RADIUS * T.GLOW_SCALE);
    group.add(glow); group.add(sphere);                          // glow behind, sphere in front
    group.scale.setScalar(node.state === 'forming' ? 0.001 : 1); // grown nodes bloom from ~0, no flash
    node.__mat = mat; node.__group = group; node.__glowMat = glowMat;
    return group;
  }

  /* ── init 3d-force-graph ─────────────────────────────────── */
  const Graph = ForceGraph3D({ controlType: 'orbit' })(document.getElementById('graph'))
    .backgroundColor('#060608')
    .showNavInfo(false)
    .nodeThreeObject(makeNodeObject)
    .nodeThreeObjectExtend(false)
    .linkThreeObject(link => {
      const mat = new THREE.LineBasicMaterial({ color: 0x9fb6ff, transparent: true, opacity: T.LINK_OPACITY_PH });
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
      link.__mat = mat; link.__target = T.LINK_OPACITY_PH;
      return new THREE.Line(geom, mat);
    })
    .linkPositionUpdate((line, { start, end }) => {
      const p = line.geometry.attributes.position;
      p.setXYZ(0, start.x, start.y, start.z); p.setXYZ(1, end.x, end.y, end.z); p.needsUpdate = true;
      return true;
    })
    .onNodeHover(onHover)
    .graphData({ nodes, links });

  // forces: kill the default centre pull (no hub), space clusters, settle calmly
  Graph.d3Force('center', null);
  Graph.d3Force('charge').strength(T.CHARGE_STRENGTH);
  Graph.d3Force('link').distance(T.LINK_DISTANCE).strength(0.4);
  Graph.d3Force('cluster', clusterForce());
  Graph.d3VelocityDecay(T.VELOCITY_DECAY).d3AlphaDecay(T.ALPHA_DECAY).cooldownTime(T.COOLDOWN_TIME);

  function clusterForce() {
    let ns;
    const f = (alpha) => {
      for (const n of ns) {
        const c = regionCenters[n.region];
        n.vx += (c.x - n.x) * T.CLUSTER_STRENGTH * alpha;
        n.vy += (c.y - n.y) * T.CLUSTER_STRENGTH * alpha;
        n.vz += (c.z - n.z) * T.CLUSTER_STRENGTH * alpha;
      }
    };
    f.initialize = (n) => { ns = n; };
    return f;
  }

  /* ── scene polish: lights + fog (glossy, premium, deep) ──── */
  const scene = Graph.scene();
  scene.fog = new THREE.FogExp2(T.BG, T.FOG_DENSITY);
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const key = new THREE.DirectionalLight(0xfff4e0, 1.05); key.position.set(120, 160, 90); scene.add(key);
  const cool = new THREE.PointLight(0x88a0ff, 0.6, 900); cool.position.set(-140, -60, -120); scene.add(cool);

  // Size the renderer explicitly to the viewport (the fixed container can measure
  // 0 at init, which leaves the canvas 0×0 and the scene invisible).
  const sizeGraph = () => Graph.width(window.innerWidth).height(window.innerHeight);
  sizeGraph();
  window.addEventListener('resize', sizeGraph);

  Graph.cameraPosition({ x: 0, y: 34, z: 322 });
  const cam = Graph.camera();
  const controls = Graph.controls();
  controls.autoRotate = true; controls.autoRotateSpeed = T.DRIFT_SPEED;
  controls.enableDamping = false;            // off: lets the activation tween drive the camera cleanly
  controls.minDistance = 90; controls.maxDistance = 600;

  /* ── hover contextual card ───────────────────────────────── */
  const card = document.getElementById('card');
  let hovered = null;
  function onHover(node) {
    hovered = node;
    document.getElementById('graph').style.cursor = node ? 'pointer' : '';
    if (!node) { card.classList.remove('show'); return; }
    const reg = REGIONS[node.region];
    card.querySelector('.swatch').style.background = hexCss(node.color);
    if (node.state === 'placeholder') {
      card.querySelector('.kt').textContent = reg.name + ' · placeholder';
      card.querySelector('.body').textContent = reg.sub;
      card.querySelector('.foot').textContent = reg.ph;
    } else {
      card.querySelector('.kt').textContent = reg.name;
      card.querySelector('.body').textContent = node.text;
      card.querySelector('.foot').textContent = '#' + reg.name.toLowerCase().replace(/\s+/g, '-') + ' · connected';
    }
    card.classList.add('show');
  }
  function placeCard() {
    if (!hovered) return;
    const c = Graph.graph2ScreenCoords(hovered.x, hovered.y, hovered.z);
    let left = c.x + 16, top = c.y + 16;
    left = Math.min(left, window.innerWidth - card.offsetWidth - 16);
    top = Math.min(top, window.innerHeight - card.offsetHeight - 16);
    card.style.left = left + 'px'; card.style.top = top + 'px';
  }

  /* ════════════════════════════════════════════════════════════════════════
     THE ACTIVATION MOMENT — big, dynamic, cinematic (but premium)
     A store fires four coordinated beats: (1) the camera glides in to frame the
     region, (2) the node blooms + ignites with a soft glow, (3) light-pulses run
     out along its new links into the brain, (4) the whole graph swells with light
     once and settles. Then the camera eases back to the calm overview.
     ════════════════════════════════════════════════════════════════════════ */
  let itemCount = 0, firstStored = false;

  function store(text) {
    text = (text || '').trim();
    if (!text) return;
    const ri = pickRegion(text);
    let node = nodes.find(n => n.region === ri && n.state === 'placeholder');
    if (node) activate(node, text); else node = addAndActivate(ri, text);
    itemCount++;
    document.getElementById('count').textContent = itemCount;
    focusCamera(ri);                                              // (1) cinematic push-in → hold → return
    triggerSwell(firstStored ? T.SWELL_AMOUNT : T.SWELL_AMOUNT_FIRST); // (4) brain swell — grander the first time
    toast(REGIONS[ri].name);
    if (!firstStored) {
      firstStored = true;
      const h = document.getElementById('hint'); h.style.opacity = 0;
      setTimeout(() => {
        h.textContent = 'Your brain is alive — that thought found its place and wired itself in. Hover any node to see what it holds.';
        h.style.opacity = 1;
      }, 480);
    }
    Graph.d3ReheatSimulation && Graph.d3ReheatSimulation();       // the cluster gently accommodates
  }

  function brightenLinks(node) {
    for (const l of links) {
      const sId = (l.source && l.source.id) || l.source, tId = (l.target && l.target.id) || l.target;
      if (sId === node.id || tId === node.id) l.__target = T.LINK_OPACITY_ACTIVE;
    }
  }
  function neighborsOf(node) {
    const out = [];
    for (const l of links) {
      const s = l.source, t = l.target, sId = (s && s.id) || s, tId = (t && t.id) || t;
      if (sId === node.id) out.push(typeof t === 'object' ? t : nodes.find(n => n.id === tId));
      else if (tId === node.id) out.push(typeof s === 'object' ? s : nodes.find(n => n.id === sId));
    }
    return out.filter(Boolean);
  }

  function activate(node, text) {
    node.state = 'forming'; node.text = text; node.__start = performance.now();
    if (node.__group) node.__group.scale.setScalar(0.001);       // (2) bloom from near-zero (tick handles rest)
    brightenLinks(node);
    neighborsOf(node).forEach((nb, i) => firePulse(node, nb, 150 + i * T.PULSE_STAGGER)); // (3) wiring in
  }

  // Region full → grow a fresh node (the graph keeps filling out). Starts 'forming'
  // so a rapid follow-up store can't grab it before its mesh exists.
  function addAndActivate(ri, text) {
    const c = regionCenters[ri];
    const node = { id: 'n' + (nid++), region: ri, color: REGIONS[ri].color, state: 'forming', text: text, __start: performance.now(),
                   x: c.x + (Math.random() - 0.5) * 20, y: c.y + (Math.random() - 0.5) * 20, z: c.z + (Math.random() - 0.5) * 20 };
    const anchor = REGIONS[ri]._ids[0];
    nodes.push(node); links.push({ source: node.id, target: anchor });
    REGIONS[ri]._ids.push(node.id);
    Graph.graphData({ nodes, links });
    brightenLinks(node);
    const anchorNode = nodes.find(n => n.id === anchor);
    if (anchorNode) firePulse(node, anchorNode, 220);
    return node;
  }

  /* (1) camera focus arc ─────────────────────────────────────────────────── */
  let camAnim = null;
  function camTween(toPos, toTgt, dur, onDone) {
    controls.autoRotate = false;
    camAnim = { t0: performance.now(), dur, fromPos: cam.position.clone(), toPos, fromTgt: controls.target.clone(), toTgt, onDone };
  }
  function focusCamera(ri) {
    const c = regionCenters[ri], cv = new THREE.Vector3(c.x, c.y, c.z);
    const focusPos = cv.clone().add(cv.clone().normalize().multiplyScalar(T.FOCUS_DISTANCE)).add(new THREE.Vector3(0, 18, 0));
    camTween(focusPos, cv.clone(), T.FOCUS_MS, () => {
      setTimeout(() => camTween(new THREE.Vector3(0, 34, 322), new THREE.Vector3(0, 0, 0), T.RETURN_MS, () => { controls.autoRotate = true; }), T.FOCUS_HOLD_MS);
    });
  }

  /* (3) light-pulses travelling along the new links ──────────────────────── */
  const pulses = [];
  function firePulse(fromNode, toNode, delay) {
    setTimeout(() => {
      const mat = new THREE.SpriteMaterial({ map: GLOW_TEX, color: 0xffffff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
      const s = new THREE.Sprite(mat); s.scale.setScalar(T.NODE_RADIUS * 2.4); scene.add(s);
      pulses.push({ s, mat, from: fromNode, to: toNode, t0: performance.now() });
    }, delay);
  }

  /* (4) the brain's luminous swell ───────────────────────────────────────── */
  let swellT0 = -1, swellAmt = 0;
  function triggerSwell(amount) { swellT0 = performance.now(); swellAmt = amount; }

  /* ── confirmation toast (understated) ────────────────────── */
  const toastEl = document.getElementById('toast');
  let toastTimer = null;
  function toast(regionName) {
    toastEl.querySelector('.tt').textContent = 'Stored. Added to your ' + regionName + ' and connected.';
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3400);
  }

  /* ── main animation loop ─────────────────────────────────── */
  const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

  function tick() {
    const now = performance.now();

    // brain swell (a single luminous rise + settle across the whole graph)
    let swell = 0;
    if (swellT0 >= 0) {
      const p = (now - swellT0) / T.SWELL_MS;
      if (p >= 1) swellT0 = -1; else swell = Math.sin(p * Math.PI) * swellAmt;
    }

    for (const n of nodes) {
      const g = n.__group;
      if (!g) { if (n.state === 'forming') n.__start = now; continue; }  // mesh not built yet → wait, bloom when ready
      let formE = 1, baseEm, baseOp, baseRough;
      if (n.state === 'forming') {
        const t = Math.min(1, (now - n.__start) / T.FORMATION_MS);
        formE = easeOut(t);
        g.scale.setScalar(0.001 + formE * T.ACTIVE_SCALE);
        baseEm = lerp(T.PH_EMISSIVE, T.ACTIVE_EMISSIVE, formE);
        baseOp = lerp(T.PH_OPACITY, T.ACTIVE_OPACITY, formE);
        baseRough = lerp(T.PH_ROUGH, T.ACTIVE_ROUGH, formE);
        if (t >= 1) { n.state = 'active'; n.__flareT0 = now; }   // ignite flare at completion
      } else if (n.state === 'active') {
        baseEm = T.ACTIVE_EMISSIVE; baseOp = T.ACTIVE_OPACITY; baseRough = T.ACTIVE_ROUGH;
        const fl = n.__flareT0 ? Math.max(0, 1 - (now - n.__flareT0) / 700) : 0;
        baseEm += fl * T.BLOOM_FLARE;                            // brief confident ignite, eases back
      } else { // placeholder
        baseEm = T.PH_EMISSIVE; baseOp = T.PH_OPACITY; baseRough = T.PH_ROUGH;
      }
      n.__mat.emissiveIntensity = baseEm + swell;               // the swell lifts every node at once
      n.__mat.opacity = baseOp;
      n.__mat.roughness = baseRough;
      if (n.__glowMat) {                                         // stored nodes carry a soft glow; placeholders none
        const tg = (n.state === 'placeholder') ? 0 : T.GLOW_OPACITY * (n.state === 'forming' ? formE : 1);
        n.__glowMat.opacity += (tg - n.__glowMat.opacity) * 0.12;
      }
    }

    // links: ease toward placeholder/active opacity
    for (const l of links) {
      if (l.__mat) l.__mat.opacity += ((l.__target ?? T.LINK_OPACITY_PH) - l.__mat.opacity) * 0.05;
    }

    // (3) light-pulses gliding along the new links into the brain
    for (let i = pulses.length - 1; i >= 0; i--) {
      const pu = pulses[i], p = (now - pu.t0) / T.PULSE_MS;
      if (p >= 1) { scene.remove(pu.s); pu.mat.dispose(); pulses.splice(i, 1); continue; }
      const a = pu.from, b = pu.to;
      pu.s.position.set(a.x + (b.x - a.x) * p, a.y + (b.y - a.y) * p, a.z + (b.z - a.z) * p);
      pu.mat.opacity = Math.sin(p * Math.PI) * 0.95;
    }

    // (1) camera focus arc
    if (camAnim) {
      const p = Math.min(1, (now - camAnim.t0) / camAnim.dur), e = easeInOut(p);
      cam.position.lerpVectors(camAnim.fromPos, camAnim.toPos, e);
      const tg = new THREE.Vector3().lerpVectors(camAnim.fromTgt, camAnim.toTgt, e);
      controls.target.copy(tg); cam.lookAt(tg);
      if (p >= 1) { const d = camAnim.onDone; camAnim = null; if (d) d(); }
    }

    placeCard();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  /* ── composer + chips + lifting the veil ─────────────────── */
  const input = document.getElementById('input');
  document.getElementById('store').addEventListener('click', () => { store(input.value); input.value = ''; });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { store(input.value); input.value = ''; } });
  const chipsEl = document.getElementById('chips');
  CHIPS.forEach(txt => {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = txt.length > 42 ? txt.slice(0, 40) + '…' : txt;
    b.title = txt; b.addEventListener('click', () => store(txt));
    chipsEl.appendChild(b);
  });

  // lift the veil once the engine has had a moment to lay the clusters out
  setTimeout(() => document.getElementById('veil').classList.add('gone'), 900);
  </script>
</body>
