<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nothing here · MyAITwin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#FBFAF7; --ink:#0F0E0D; --mut:#6B6760; --yellow:#FFE34A; --line:#E0DDD4; }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Source Serif 4',Georgia,serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%; max-width:460px; text-align:left;
    border:1.5px solid var(--ink); border-radius:14px;
    box-shadow:4px 4px 0 var(--ink); background:#fff;
    padding:34px 32px 30px;
  }
  .eyebrow{ font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.14em; color:var(--mut); }
  h1{ font-size:2rem; font-weight:600; letter-spacing:-0.02em; line-height:1.1; margin:8px 0 0; }
  p{ font-size:15px; color:var(--mut); line-height:1.55; margin:12px 0 0; }
  .btn{
    display:inline-block; margin-top:22px;
    font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600;
    text-transform:uppercase; letter-spacing:0.06em; text-decoration:none; color:var(--ink);
    background:var(--yellow); border:1.5px solid var(--ink); border-radius:9px;
    padding:11px 16px; box-shadow:2px 2px 0 var(--ink);
    transition:transform 120ms, box-shadow 120ms;
  }
  .btn:hover{ transform:translate(-1px,-1px); box-shadow:3px 3px 0 var(--ink); }
</style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">404</p>
    <h1>Nothing here.</h1>
    <p>This page does not exist, or it moved. Your twin is where you left it.</p>
    <a class="btn" href="/twin">Back to your twin</a>
  </main>
</body>
</html>
